# Soteria configuration (/etc/soteria/soteria.toml)
#
# Validate changes with:  soteria config validate
# Invalid settings stop Soteria from starting; they never silently turn
# monitoring off. Disabling a monitor below is allowed, but it is reported
# as a coverage gap by `soteria status` and `soteria verify`.

# Configuration schema version.
version = 1

[general]
# One of: error, warn, info, debug, trace
log_level = "info"
database = "/var/lib/soteria/soteria.db"
# Events and execution records older than this are deleted. Alerts, their
# history and baselines are kept.
event_retention_days = 90
# Administrator detection rules and overrides: *.toml files, see
# 'soteria rules' and docs/RULES.md.
rules_directory = "/etc/soteria/rules.d"

[monitoring]
execution = true
file_integrity = true
configuration = true
kernel = true
persistence = true
users = true

[scanning]
# Durations accept forms such as "30m", "6h" or "1d".
full_scan_interval = "24h"
critical_scan_interval = "6h"
kernel_scan_interval = "24h"
startup_scan = true

[paths]
# Paths that do not exist on this distribution are skipped and reported.
include = [
  "/etc", "/usr/bin", "/usr/sbin", "/usr/lib", "/usr/lib64",
  "/boot", "/bin", "/sbin", "/lib", "/lib64", "/usr/local/bin",
  "/usr/local/sbin"
]
exclude = ["/proc", "/sys", "/dev", "/run"]
# Persistence locations outside the include list (FR-020): SSH keys, shell
# startup files, per-user units and autostart entries, cron and at spools.
# `*` and `?` match within one path component. Missing ones are skipped
# silently; homes created later are picked up at the next restart.
persistence = [
  "/root/.ssh", "/root/.bashrc", "/root/.bash_profile", "/root/.profile",
  "/root/.zshrc", "/root/.config/systemd/user", "/root/.config/autostart",
  "/home/*/.ssh", "/home/*/.bashrc", "/home/*/.bash_profile",
  "/home/*/.bash_login", "/home/*/.profile", "/home/*/.zshrc",
  "/home/*/.zprofile", "/home/*/.config/systemd/user",
  "/home/*/.config/autostart", "/var/spool/cron", "/var/spool/at"
]
# Monitor Soteria's own program, configuration, rules, keys, audit rule and
# unit files; any change raises a critical SELF-001 alert (FR-036).
own_files = true

[execution]
# Command-line arguments stored with each execution (NFR-011):
#   "redacted" (values that look like passwords, tokens or keys are
#   replaced), "full", or "none" (program name only).
arguments = "redacted"
max_argument_bytes = 4096
# Executables larger than this are not hashed (bytes).
hash_max_bytes = 268435456
# Execution from these locations is flagged as unusual (FR-011), as is
# execution of hidden, deleted, memory-only or non-root-writable programs.
unusual_paths = [
  "/tmp", "/var/tmp", "/dev/shm", "/run/user", "/dev/mqueue", "/home", "/root"
]
# A program created or changed this recently counts as new.
recent_change = "1h"

[baseline]
# Ed25519 key pair that seals approved baselines, created by `soteria init`.
# The signing key must be readable by root only; the daemon only reads the
# public key.
signing_key = "/etc/soteria/keys/baseline.key"
public_key = "/etc/soteria/keys/baseline.pub"

# Email and webhook notifications (switched on by alerts.email and
# alerts.webhook below). Core monitoring never depends on them: delivery
# runs separately, failures are retried and reported by 'soteria status'.
[notifications.email]
# SMTP relay as host or host:port. Mail is always encrypted: "starttls"
# (port 587 by default) or "implicit" TLS (port 465). Plain SMTP is refused.
relay = ""
tls = "starttls"
from = ""
to = []
# Optional login (AUTH PLAIN). The password is read from a file readable
# only by root and the soteria group, never written in this file.
username = ""
password_file = ""
# PEM CA certificates to trust instead of the system store.
ca_file = ""
minimum_severity = "high"
timeout = "30s"

[notifications.webhook]
# HTTPS endpoint receiving {"source", "hostname", "alerts": [...]} as JSON.
url = ""
# Optional bearer token, read from a file (Authorization: Bearer ...).
token_file = ""
ca_file = ""
minimum_severity = "high"
timeout = "10s"

[alerts]
# One of: critical, high, medium, low, info
minimum_severity = "low"
# Related alerts (same object, a changed program that then ran, one login
# session or process chain) this close together form an incident.
correlation_window = "1h"
journal = true
email = false
webhook = false
