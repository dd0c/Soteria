[workspace]
resolver = "3"
members = [
    "crates/soteria-core",
    "crates/soteria-config",
    "crates/soteria-platform",
    "crates/soteria-store",
    "crates/soteria-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/dd0c/Soteria"

[workspace.dependencies]
soteria-core = { path = "crates/soteria-core" }
soteria-config = { path = "crates/soteria-config" }
soteria-platform = { path = "crates/soteria-platform" }
soteria-store = { path = "crates/soteria-store" }
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
humantime = "2"
signal-hook = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
