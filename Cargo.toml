[workspace]
resolver = "3"
members = [
    "crates/soteria-core",
    "crates/soteria-config",
    "crates/soteria-platform",
    "crates/soteria-store",
    "crates/soteria-inventory",
    "crates/soteria-integrity",
    "crates/soteria-sensors",
    "crates/soteria-rules",
    "crates/soteria-notify",
    "crates/soteria-agent",
    "crates/soteria-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/dd0c/Soteria"

[workspace.dependencies]
soteria-core = { path = "crates/soteria-core" }
soteria-config = { path = "crates/soteria-config" }
soteria-platform = { path = "crates/soteria-platform" }
soteria-store = { path = "crates/soteria-store" }
soteria-inventory = { path = "crates/soteria-inventory" }
soteria-integrity = { path = "crates/soteria-integrity" }
soteria-sensors = { path = "crates/soteria-sensors" }
soteria-rules = { path = "crates/soteria-rules" }
soteria-notify = { path = "crates/soteria-notify" }
soteria-agent = { path = "crates/soteria-agent" }
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
humantime = "2"
signal-hook = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
sha2 = "0.10"
ed25519-dalek = "2.2"
xattr = "1.5"
libc = "0.2"
netlink-sys = { version = "0.8", default-features = false }
inotify = { version = "0.11", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1.12", features = ["std"] }
rcgen = "0.13"
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
